<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Markdown Live Preview - Online markdown editor with real-time preview" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Markdown Live Preview</title>
  </head>
  <body>
    <header>
      <div class="toolbar">
        <a href="/" class="logo">Markdown Live Preview</a>
        <div class="toolbar-actions">
          <button id="open-btn" type="button">Open</button>
          <input type="file" id="file-input" accept=".md,.markdown,.txt" hidden />
          <button id="copy-btn" type="button">Copy</button>
          <div class="export-dropdown">
            <button id="export-btn" type="button">Export PDF</button>
            <button id="export-toggle" type="button" aria-label="Export options">&#9662;</button>
            <div class="export-menu" id="export-menu">
              <button data-format="pdf">Export as PDF</button>
              <button data-format="docx">Export as DOCX</button>
            </div>
          </div>
          <button id="reset-btn" type="button">Reset</button>
          <label class="toggle-label"><input type="checkbox" id="sync-scroll-cb" checked /><span>Sync scroll</span></label>
          <label class="toggle-label"><input type="checkbox" id="dark-mode-cb" /><span>Dark mode</span></label>
        </div>
      </div>
    </header>

    <div id="container">
      <div id="editor-pane"></div>
      <div id="divider"></div>
      <div id="preview-pane">
        <div id="preview" class="markdown-body"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
